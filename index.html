/* V3: pacing comparison demo */
.timing-box{border:1px solid #c1a0b6;background:#f0e1e7;padding:15px 16px;margin:18px 0 7px;text-align:left}

.progress-fill{display:block;width:0;height:100%;background:#bd598e;transition:width .45s ease}
.feed{margin-top:12px;max-height:340px;overflow-y:auto;scrollbar-color:#946f8b #272030}

țat la căsnicie, iar un preot și-a reconsiderat cariera. Cauza oficială a morții rămâne clasificată. Procesul-verbal menționează doar „o intrare neașteptată”, urmată de „apariția unor circumstanțe agravante”. De atunci, privește peste umăr și întreabă foarte politicos: „Scuze, dumneavoastră erați la rând în spatele meu?”","warning":"Are nevoie de spațiu personal. Preferabil în spatele ei.","verdict":"Interdicție de a se apleca în instituțiile publice fără autorizație de la Ghișeul 4.","annex":"Cabaretul „La Sfântul Păcătos” a ars în 1931. Pe lista victimelor sunt [[41 de nume]]; sala avea 40 de locuri. Al 41-lea spectator [[stătea în spatele ei]]. De atunci, când întreabă cine e la rând, [[nu te întreabă pe tine]]."},"adoption":{"status":"available","nickname":null,"adopted_at":null},"en":{"title":"Countess of the Over-the-Shoulder Glance","charges":"Obstructing traffic; dangerously distracting bystanders; repeatedly requesting rear entrance access.","story":"Posterioara was the star of the Saintly Sinner cabaret, famous for stopping conversations without saying a word. One evening she bent down to pick up a coin. Seven men fainted, three reconsidered their marriages, and a priest reconsidered his career. Her official cause of death is classified. The report mentions “an unexpected entrance” and “aggravating circumstances.” She still looks over her shoulder and sweetly asks: “Excuse me, were you waiting behind me?”","warning":"She needs personal space. Preferably behind her.","verdict":"Forbidden from bending over in government offices without written permission from Counter 4.","annex":"The Holy Sinner cabaret burned down in 1931. The list of victims has [[41 names]]; the hall seated 40. The 41st spectator [[stood right behind her]]. Since then, when she asks who is next in line, [[she isn’t asking you]]."},"image_path":"data:image/webp;base64,UklGRl48AABXRUJQVlA4IFI8AACQ6QGdASogAyADPlUqkkajq6YoJHP4kXAKiWlu/7rlL0q/WUsWg7rXkH1xZMysv3338emX0P/huI6KXT3pDea/+VbYwYmtI0W CaZkCHGlhi1va6jJQY79UsebODhzJuWjH/45kawpNmi407JCrjpUbK7atepRvzJwbqfwsTAAO8Acv08nRYPOAGVNyooqnjYr9/hofJN0e5ns6Uwnl58YAAAAAA=="},{"id":"003","name":"KAREN MORTICIA","image":"Fantoma_003.jpg","qr_url":"https://nistoras.github.io/?g=003","ro":{"title":"Inspectoarea Supremă a Nemulțumirilor","charges":"Hărțuirea managementului; reclamații nefondate; terorism administrativ.","story":"Karen Morticia a murit în timp ce cerea să vorbească cu managerul unei ambulanțe. Considera că personalul nu demonstra suficientă urgență. Ajunsă în Iad, a depus imediat o reclamație privind temperatura, iluminatul și lipsa parcării gratuite. A cerut să vorbească cu managerul Iadului. Lucifer și-a dat demisia după 48 de ore. Transferată în Rai, a descoperit că îngerii nu au ecusoane cu numele la vedere și a cerut condica de sugestii și reclamații. În prezent, nici Raiul, nici Iadul nu acceptă să-i proceseze dosarul.","warning":"Nu-i spune niciodată „calmează-te”. Ultimul care a încercat este încă într-o ședință disciplinară.","verdict":"Obligată să aștepte la Ghișeul 4 până când funcționara revine din pauză. Funcționara a murit în 1987.","annex":"Condica de reclamații a Ministerului are [[1.203 pagini]] scrise de mâna ei. Ultimele 40 nu mai sunt reclamații. Sunt [[numele managerilor]], tăiate cu o linie, [[în ordinea decesului]]. Pagina următoare e goală și are deja antetul: „Managerul de tură, Ghișeul 4”."},"adoption":{"status":"available","nickname":null,"adopted_at":null},"en":{"title":"Supreme Inspector of Complaints","charges":"Harassing management; frivolous complaints; administrative terrorism.","story":"Karen Morticia died demanding to speak to the manager of an ambulance because the staff didn’t look urgent enough. In Hell, she filed complaints about the heat, the lighting, and the parking. Lucifer resigned after 48 hours. Transferred to Heaven, she demanded visible name tags for all angels and a formal complaints register. Neither Heaven nor Hell will process her paperwork now.","warning":"Never tell her to calm down. The last person who tried is still in a disciplinary hearing.","verdict":"Ordered to wait at Counter 4 until the clerk returns. The clerk died in 1987.","annex":"The Ministry’s complaints book holds [[1,203 pages]] in her handwriting. The last 40 are not complaints. They are [[managers’ names]], each crossed out once, [[in order of death]]. The next page is blank and already headed: “Shift manager, Counter 4”."},"image_path":"data:image/webp;base64,UklGRlAwAABXRUJQVlA4IEQwAADQjwGdASogAyADPlUqkkcjoqiqIlKYoUAKiWlu/8U6m3XxF0JoV2Pene19WpBa3vrvidPf9d0vbL0UuoBSF8h7bE/32K/r3xjH3c4v6+oL+t9PD1Kc6z6hd6l/tHqq9NrkMrzP3H7kGIt/MMke36TN//L4/NQb+/87fpZnSMQjQeQK1+WJAUk0ySGzIRy2wrX5YkbwOdA/nsKXn0IZ2LIaTBL2G367ItX4w366OmQ0eemH0nK4fs3C/P0fiBWvyxSTUBSk9h+h2CTGKLMLU+rFci0wNoP7w/ingn2ppkZbOZ3y1KmjZsD2PNz84D+kTYuwqLUk7XDfrkXCl8Yb9diVkCXj0ZqebXEQgvyRMzd+x6MI0IDPUqXZNBv3ETyCPhCABzlsabV57m1ZmhSU1tmUw2hKAzAMEu5k1E7tvyeSW9yqYtxXGHVGY5EaZjblvRMEvjDfrlJglbKbhKaZEnZkJd9g0wCBW8Z+j4sY+s1uhneLudXTTxmuxxzjZ1QX2I0TFJNQE1R2WER6WFyk8jx5f96ez7KcPPOYgu9CUZmkU+DhwRJ+w2KJRk1lJlp8XclOJiLdRyrM9PellQcAtTROeSQ87jMaZkNJlch9sRDAdfVJJ4/prhLbLZ5ou2LquUMNKlzrqPRCE7u5FvOyHSSxKxzrY5A1J2JtmqAmnBhYEmJGUz64hGWoKvAi9GEY+cmdezdpUf0YYCFz7k2kACq9G7OG5MJ4AEX2wiu73txWMl6m9nKskl7KZyIYmRTM9ci4TDXCXby7Xu5dcfbEYU9+ICY03nxbvNT2efuMktWw/lhFxTkdw2c9KGAlFVZsyXqtPitzyTw8YUeGwI9CIu7rDH3PTnRNTvlQVKSY2vaXmbwbjER079SHhg08t8F4k5iOG/GfgmN8TTzFcj5wzusrsTYoNWNmbJ7HYEji6IwDE79Li/IOrY+Jl3ck30+TQLmBJN4URXNBhmQAP1OXluqsKCE9WRMhyfUS9R6rRjRbln+7u8RBgaoKa+uFK/nx6VaaFOWPfju8W8CNiQyEwXgPpXGZ9GsqwmVC4H3dG7EsYoBboZ8LNqoHLid+2+Qr6AU8ltdcnLzOcmLlkhRveq+BII1/IFqtRPyPaUsiG2qSftVwwKWJkNJSEX0fsIy1Hj6zJbgiZP9DUnp+eMytG7s3+11pAI51khqZsO2FPPrjtLn6WgsA8IZqIk7W667ChFhF5+47xaPdFXAbuzBBeYgcgVnKXvKR2tFXnd1X2RDfyUReh9Z72hKa1MBDgskowDyI8FzlCBR3rBTVxwStAGPK2fdcG+y3yeIoIsSYHQGf2XM5keB1FJrA8MeWbbqvbQdBYuxQcbuGEDBUW71wsoH9oQ/F5SV0Ll+ZhMUiv2mkTLTg59JUh4pc6VoGm5rl3yuuTOHEeCzsEH1dl+NRQAQqJRR0CxY9MFbt2+IDJQN1tzrciMsRlU+/DE72aMvODgjbNJbi1NKlyy ","ro":{"title":"Pisica-Fantomă Fără Personalitate","charges":"Absența caracterului; lipsă de inițiativă; ocupare ilegală de spațiu afectiv.","story":"Miau Null este singura entitate din istoria Ministerului care a completat rubrica „Personalitate” cu expresia „Nu știu, tu ce crezi?”. În timpul vieții, nu a avut niciodată o părere proprie. Mâncarea preferată? „Ce mănânci și tu.” Muzica preferată? „Ascult de toate.” Poziția preferată? „Cum vrei tu.” A murit așteptând ca altcineva să decidă dacă trebuie să traverseze strada. La interviul de admitere în viața de apoi, Comisia i-a pus 27 de întrebări. A răspuns la toate cu „Da, sigur, dacă ziceți voi”. Nici măcar nu este clar dacă este pisică, fantomă sau un cearșaf cu anxietate.","warning":"Nu-i cere să aleagă un restaurant. Veți muri amândoi. Din nou.","verdict":"Achitată din lipsă de personalitate juridică. Nici sentința nu a impresionat-o.","annex":"Comisia a fotografiat-o de 27 de ori pentru dosar. Pe fiecare fotografie are [[fața altui membru]] al Comisiei. Pe a 28-a, făcută ieri, [[are fața ta]]. Întrebată ce vrea să fie, a răspuns: „[[Ce ești și tu.]]”"},"adoption":{"status":"available","nickname":null,"adopted_at":null},"en":{"title":"The Ghost Cat With No Personality","charges":"Absence of character; chronic indecision; illegal occupation of emotional space.","story":"Miau Null is the only being ever to put “I don’t know, what do you think?” under Personality on Form 69. Favourite food? “Whatever you’re having.” Favourite music? “A bit of everything.” Favourite position? “Whatever you want.” She died waiting for someone else to decide whether to cross the road. Asked 27 questions at her afterlife interview, she agreed with all of them. No one can tell if she is a cat, a ghost, or a bedsheet with anxiety.","warning":"Never ask her to choose a restaurant. You will both die. Again.","verdict":"Acquitted for lack of legal personality. She had no opinion on the ruling.","annex":"The Commission photographed her 27 times for the file. In each photo she has [[another member’s face]]. In the 28th, taken yesterday, [[she has your face]]. Asked what she wants to be, she said: “[[Whatever you are.]]”"},"image_path":"data:image/webp;base64,UklGRvgpAABXRUJQVlA4IOwpAAAwagGdASogAyADPlUqkkcjpyyjIpQYcZAKiWlu/6Q5N7YCmCMHrRJcObYFvzf1czvvrvZdM//d1XbX0VeoxSO8ibbT/4+Lgi3VOaPV3nvH/vUj/lvTA9N/qT50z/v+tvoef+z7Rv8k9VLzur6NeY+5vcX/Sccxx3vYM2eCpq7rksy/+3+jNpwDvdmW8zSRxf9K3y3gIobjjABbxI4v+lrJEsPYDBi4EORA9n+Y0DBX4wOEYuXanfVBxXu1PjA2nzexBCXtyLuxZvBExI5ARqsIShl8oZyLEH98lNyjj4/pQNE7/S1RsKmmwX/St/oGYmTsEeXI8BHbYHh34EHmKNWLcsSHHOgf7wdSSHRhWoPRbsl7ckOOdUGxzKxtFgL/qEmBzqj4tl8VQOtFWkUNxxhIdExNPy5UI4AKHSOPvk5y+GwHycMxTJOLD30sJZg0RVgv0aAz8yfWC7oH+8DskhxzqHLaDul1DnWIcYO4NzFSx0t0PbjKaphapge6EQHKEDzSdNeP3itL+XJB+gOkvxGp3zO/EDrOubMrHP+eXeQIAqG2QM53I2ccuxXSszf31QbFr2rRGsIupJDfgZgRZk20o2MHaQk3s/XHhjVhV12D80HYXjjlzN12Sky/HgXLPwZ7NysLlg2vJsfncc7UPSqy4vCul7RtdSvVBgsGe/6srHetZMPx9OfoYAyvhLCGS4m4Ene8zTWmFAcP1sAWkpzechCJY28epES7rZHTgftGtIaqRFdkb1q3rAIQJagqNRuLtMbh7q0ROxIdBgnoz74GC1KSD2y/TmC3v925IcZS26iHRsTg/Y7PmuVGwM7jEEvl65IsKh2P96FYDnE3OUZhcNA03MZBeMakJJMFhGDu0UQ5kCg/5UbnVhgGRaO8xdgpQKts/tNDv8lUFoZXC39AY4XS/AbI/Q6RMbWgIIkwluZDy4EQUc/4vgoSBEptCODmRE+hWvu6r6FGVMGH4vVOodoyZ4tzeoG3EBXFpQ60r1wZ+572Yw2LTbwqwqO2q8rcBB+pF+vnwrOa39WWfI4sAJxkAy5H9QHshbGVcrW7INe3w/dxn1nQIZxXLPkTu85BHVerU3Zu6il7cw5b/mKhioFjxZ06D3HDGqbLYgoNkqepBAojVRd8+5af7wK8JzMB3xLWJCGXxXGHaNzfr0G1/OpesYFBNv0yNjIZhC478TiWxmdwl6uZ9BTjKrzGJpjoEo1MDOJZ2kW6khSDL+jdYm7cJiNWEZRs3IKYtcmFpEJdL87tKMuztev3g2FGoDC0i5DpLIG8b8IFb8kubBGDVCpLnZtr0PNejCFCNk+cGDf8nugWJk/fQF/lNHcbKmmQLGkHWgarQeR2ZIB6j30VXg9YhiDh4g7zC5YVDQ7+BoJhF0ln5OAGsOqxZyC4a4YlJE24ddpKnUo9wiJ/CZtBRJOU4yhg2kTmthXmzWCMaffT+wqDjaMNrRoSjm9/LGPtfQz10IF29elTDZ7w6WGoci6yd7WJfjkG1RGw2XTCzWIZJEDngPA4TkVhg7ewc+uSXXQGakBu88jkGB2CVKZmr261GqFHXdscT4ezYHwOJmKtt4TzFimjgBZVN3lcay0D8Kqhf/WigU8nWevLPXy533NjtH61SkVswR4zs8+UwoDGtLIxj9ogtHEQYdYykvtVTcHWzLXMpRsSGlYK7jS/8olzDdkTg5MvEtKcu+5pZOzH15UmlVvEic8POwwem+WV1sj6a27nSRIQN6If3N8oyw  Continuă să pretindă că se află pe guest list.","annex":"Numele ei apare pe [[214 liste de invitați]] din 1998 încoace. La 213 dintre evenimente, [[o persoană de pe listă]] nu a mai ajuns acasă. Al 214-lea eveniment este [[această petrecere]]. De data asta, rezervarea ei apare în sistem."},"adoption":{"status":"available","nickname":null,"adopted_at":null},"en":{"title":"Her Excellency, Duchess of VIP","charges":"Social status fraud; seduction for upgrades; unlawful occupation of reserved tables.","story":"Divana has never entered a club without first asking where the VIP area is. She died of outrage when a bouncer said her name wasn’t on the list. In the afterlife, she claims to have dated a famous archangel but cannot reveal his name because of an NDA, darling. She only falls for men with backstage access, verified accounts, and panoramic apartments. Once she said money meant nothing to her. Then asked the price of his watch.","warning":"Without VIP access, you will be introduced as “a close family friend.”","verdict":"Demoted to general admission. Still insists she is on the guest list.","annex":"Her name has been on [[214 guest lists]] since 1998. At 213 of those events, [[someone on the list]] never made it home. The 214th event is [[this party]]. This time, her reservation is in the system."},"image_path":"data:image/webp;base64,UklGRm5AAABXRUJQVlA4IGJAAADwywGdASogAyADPlUqlEajoqkhopPIwSAKiWdu/9o8K1+mzPWnJar32An+H+PMUs9nb/891P/5bjujA1MBWPlF/ysTk8t0LZXhTQHuLzo+ovPL6av616iP9s9N/qM/8XRAemb+x9M76sX9S9SrzpPWnyFeZ9zo/n+L8Nz+e/pGPNEf4Dnb77TreLY1Av+mf6r0k9MH1/7DQek+DS9sHXcB6qgUxF3CYBLK/9bBgHqlnOX50D+5dPcPf1q0cunuKXq68a/xdbRym+4qltVt0UxRQl1U1bQV4LyfPXF2z1w0srzp3Cc6CScWhs52tFSywyN8lLmTywHAeqWcpBre39MAllmdqdZI7gRYsabzce1sc/C/uvPrz6/uv53b6/uwMsYRnv7r0F6W5GuZ1QLedgedDTPhpfDvIWoaZ8kNDYOu4TAJZjnDZPyJyedO7If3FssBNddyknqUGHr1wEBYsCfu/qqXdEGe55uebrzd5udt7+6/uv7r+68+ek9yNh51/JUWxE4RfMj9DTPh4NI1riFdI8reQm8v76pa/ZJF2RDLCCSycjk7tfzPMv0rsCAUdxt+nk0Hc+SNk4xlywgId/nEfm6pPQi2NvaXMUl1U1  cerut dopuri de urechi și concediu medical.","warning":"Dacă aude „I Will Always Love You”, abandonează imediat clădirea.","verdict":"Interzisă la karaoke pentru următorii 400 de ani. Contestă decizia cântând.","annex":"Înregistrarea de la karaoke durează [[7 minute și 12 secunde]]. Nota imposibilă începe la minutul 3. După minutul 5, spectrograma arată [[o a doua voce]] care o ține. Ana se oprește la minutul 6. [[Vocea nu se oprește.]]"},"adoption":{"status":"available","nickname":null,"adopted_at":null},"en":{"title":"The Soprano of the Apocalypse","charges":"Paranormal noise pollution; shattered glass; unauthorized Whitney Houston performances.","story":"AAAAAAAANA died at karaoke trying to hit a note physicists insist does not exist. Windows shattered, three dogs started talking, and the DJ resigned by text. She says the audience was simply intimidated by her talent. She now screams “THIS IS MY SONG!” at every track, including instrumentals. Six exorcisms failed. The last priest requested earplugs and medical leave.","warning":"If “I Will Always Love You” starts playing, evacuate immediately.","verdict":"Banned from karaoke for 400 years. Contesting the decision in song.","annex":"The karaoke recording runs [[7 minutes 12 seconds]]. The impossible note starts at minute 3. After minute 5, the spectrogram shows [[a second voice]] holding it. Ana stops at minute 6. [[The voice does not.]]"},"image_path":"data:image/webp;base64,UklGRqo1AABXRUJQVlA4IJ41AAAwvQGdASogAyADPlUqk0cjoqiqIrOIwUAKiWlu9/EVG9biiZ/xj56x+bX1aclp/TWV//fdQ21dEg4RzoP+RiwqRCp9cOf+dTuDz6fKO+X6f9xJzv/qI/s3TXetb/L6hveW6S+5jcDIBcG9zonqLVFAfxnNGhEsL1KLd2IdSde7IGt0lXe8AfBOvdiHU5wI7txCzpgHlGjDXeM+bqrDzYPZKVqrzb/AfYZIPjrZ+EriHB3TJXQWneAHql7d3vwaD24pww9T/tr31mu6Z8NdU1yO8BMBex2hLAD1S+L1u46Sro9UPU8FMm6vQsKc3nzzc83X915u83X91/ivSUx7TXnA4a3I2EkXGopWE60sviq5+KFxMRLbnT54gLDZ/cW/syIuieEjFM0gdD6pedKpVF/ka822G16CBH/UfMA2hXBsllM+o1/zc0skHAjWOPNv7r+68+ek9yNl+Hzc2L9jg9dt2IgQohcSJXSPK5OskaUzssJeg6kl7nZ1lu3o8Pip4Z8I8EdstYJ tinței încât judecătorul s-a pensionat.","annex":"Ministerul a numărat râsetele de pe înregistrarea înmormântării: [[212]]. Hăhăilina a râs de 211 ori. Celălalt râs [[vine din sicriu]], [[la 4 secunde după ea]]. Soțul nu avea simțul umorului. Avea în schimb răbdare."},"adoption":{"status":"available","nickname":null,"adopted_at":null},"en":{"title":"Countess of Inappropriate Humor","charges":"Laughing at funerals; excessive sarcasm; ruining romantic moments.","story":"Hăhăilina died at her third husband’s funeral after someone said he was “in a better place.” She laughed: “On his salary? Unlikely.” The laughter continued until her heart stopped. Guests called it the first funeral with an encore. In the afterlife she appears during intimate moments to ask, “That was it?” Her therapist started crying. She is still laughing.","warning":"Do not tell her about your last breakup. She already brought popcorn.","verdict":"Sentenced to 200 years of seriousness. The judge retired during her laughter.","annex":"The Ministry counted the laughs on the funeral recording: [[212]]. Hăhăilina laughed 211 times. The other laugh [[comes from the coffin]], [[4 seconds after hers]]. Her husband had no sense of humour. He did have patience."},"image_path":"data:image/webp;base64,UklGRrxDAABXRUJQVlA4ILBDAAAwEwKdASogAyADPlUqkkajoqimpBP4uRAKiWdu/6PuVHeTgFoO645Jdeevd/h/q5jjXwy9tT/57juiN1AKRec+xugZirdyjLuV/Qvfh9OnmM+eL1H/+Poe/+367fNd9LP1i/6B6qtki9sfTt8Y+5vch92nX4rCsll4DbW/2vGs9j25nIXp75rvl++vvYK3awWqCJ/06YNh7ZfEQXnc7fDqh1+w+62XlN7hy7txLRkGgcSVbjoG5l69y+PDfSFKUXo99ts209bw1HHhvkOVKBiLyf7GK8Fr+gmNuc2xo3p412CWaMVaHa2mw4aWF+HX+jbD2zQuQ506zojbEDebDyXs6qOgvtxjC8uOfh9tuvW0PbbvtXB6277dlnH03vttEm4Kml8h0yUciYNnVDpE/6sf1Y/QTHFEn8xtiBgvKe6vd9Yg/4OYdvms7nbYQ47L0MwUhibHrmqt8Sd/mWVIFxgEWkq77y99h5Dk7g4Xw8L4eF8OVaFkGx870+ehy2IsPm+h7C8ps7hGx6ODb38npKMwfk+/PXqceKaDgn/OJl/MxipwCashlKWVpOBpOSYyu/uoO6tABvqvg2EMJ9CRvlpvYWQblR3mvT5Y+BhLMLPMCkl+/4QU5Ol8zlumXloRaFpC6GpbUeIyl8hzCq2p7ah3XYPrsd16r77bTn0sCkjqfXFchf/imuP8ML  nu a fost găsit niciodată. Ultima poză de pe telefonul ei arată [[două umbre]], nu una. Expertiza a stabilit că a doua umbră [[nu e de urs]] și că [[zâmbește]]. Optimistina spune că e un detaliu. „Măcar ai o poveste de spus.”"},"adoption":{"status":"available","nickname":null,"adopted_at":null},"en":{"title":"Patron Saint of Catastrophic Decisions","charges":"Encouraging reckless behavior; unjustified optimism; unlicensed dating advice.","story":"Optimistina died asking “What could possibly go wrong?” while taking a selfie with a bear. She now encourages mankind’s worst decisions: “Text your ex!” “Take another shot!” “He’s totally single!” After telling someone to replace protection with optimism, the Ministry revoked her counseling license. Her record includes seventeen breakups, forty-two hangovers and a Las Vegas wedding where nobody remembers the groom. “At least you have a story,” she says.","warning":"She is your biggest red flag, and insists green is your colour.","verdict":"Sentenced to live with the consequences of her own advice. Immediately requested a retrial.","annex":"The bear was never found. The last photo on her phone shows [[two shadows]], not one. Experts confirmed the second shadow [[is not a bear’s]] and that [[it is smiling]]. Optimistina calls it a detail. “At least you’ve got a story to tell.”"},"image_path":"data:image/webp;base64,UklGRgQ6AABXRUJQVlA4IPg5AADw0QGdASogAyADPlUqkkcjoqioInH44RAKiWlu/789C7YA+yJHt5KsObYZPzf0vPbsLsQdM/+91jbV0Tmn7R7zpL+Xip25w0fWXcfnUPyepD+8efx67/U9zrXpp88z0mvWz/sPq1+dL62OQaPL/cjuPe7BQAd8slPwjh54Cn5d/W+IHh1ptvovsE+Mhpeexw77w93gq43Vj7EOysfFTgI8ov6Vcbqx+LCsPoGrkUx7rMAz0CzWvN0Yj9Mw4RTW3927dJK8+zjWRpkWy1yWNqJjAjygoKOiBxsGg89EP7rGdHlJXTUWdNbox/IdPn6Ri6XAMQ6fA2YT7mlVLjgiKWGKblJUkMTlhM1aod/doI2+XnUq/u6eG5ABxCow4jqVf4H/BbNjRHQ+nz934Z2hpnoZnH1ch9Lk8U+APjweJ39XO9RAxv32JT8iVrsbdZ9jD7dnMLH28TjjOzmdk+9FAvlPdExvSFoop5u0Efpcjkk9J8Ip0uEUemcjnd5Ed/IhwvSRR9mocU8P9OhRhdVYwWhjdxMgucgaD3Y/T2oKXxTfwFmv645gzfGVDfWDGqMxHj2uaZLhuZqv14PZ0vv6r 9 suflete-pereche]]. Au răspuns 18. Al 19-lea primește și acum mesaje „Ești treaz?” [[la 03:17 fix]], de pe numărul ei. El [[a murit în 2009]]. Mesajele apar ca citite."},"adoption":{"status":"available","nickname":null,"adopted_at":null},"en":{"title":"Love-Bombing Expert with Imaginary Fur","charges":"Unauthorized affection; blackmail by purring; disappearing once attention is secured.","story":"Pisicondria met nineteen soulmates in one week and told every one of them, “I’ve never felt this before.” She occupied their pillows, requested apartment keys, and vanished the next day for a man with a softer hoodie. She died after being ignored for eight minutes at a party. Her afterlife texts are “You awake?” “Why aren’t you answering?” and “Haha, never mind.” She sends identical messages to twelve people.","warning":"If she purrs at you, do not get attached. It is only the trial period.","verdict":"Sentenced to an exclusive relationship with a pillow. The pillow filed for a restraining order.","annex":"The Ministry contacted all [[19 soulmates]]. 18 replied. The 19th still gets “You up?” texts [[at 03:17 sharp]] from her number. He [[died in 2009]]. The messages show as read."},"image_path":"data:image/webp;base64,UklGRlAxAABXRUJQVlA4IEQxAAAQlgGdASogAyADPlUqk0cjoqilIrL4oRAKiWlu6aFfd1srkPVza/F99+hmhkSjf2em4robNPqj95D/Sw8nP+bixQJ1fml+YsKT+96Ddi+b3016DPTl/jfUZ/yPp59TPOkelD9svWA9HH1mv6D6nXnTetjkKE6Lxn7hdxn9L41uVv1LrnJVCT+nX4HOuEtZffP+p6k3+U9X//X8xX1iG75/DN3UiXEuJcTd1Im7qRLlaS4lxLib6Xh9A0aMC/yd9SKdzyjW41uPho/Hwx8MfFL31W29dfO0RP5g5g6EYs8n5Pyf03mSGqOwToBsyeK3lB9Ch1QW1Lve83Jv+X+ruPwdNycAukWSUDJtU4hmRK6T7vAQeYtbhNQAQZrjB7Up8o+GjQygKNteDSvlHwx/uTjO9Ngcnk/p1tUdit4T3eO2O1MXSwQmlHlW9fIp/jwhQrUZNK5/J8TRge4nmgNKNlNJUMncamO4Yw5B7iY1dFJ1DmflW29gpT5R8K04tUzXKBXVrFxFSTwx6kS7hIIsyW1tJrB9tUn9l3jkCkCbA5eBuOj1LvatanX2HoMrs1qtg9JJ3tBACesuWn+ISrOAu4Q3PqdZMd7b8uiseRolVxG/dflyChc1hvkI3QDgpJDu1xQE7r79PlblhZNbWoY9wlgUYgHixqjfAIqNfSI/hRciNQPjxkfr2v345AS8CjVrFq6daLuxTuPbcuTJfWat0Y/w5/OkR6N7WE0QLqXWg ,"verdict":"I s-a acordat un metru de distanță obligatorie. A contestat unitatea de măsură.","annex":"Pătura de 400 de metri a fost măsurată din nou la arhivare: [[412 metri]]. Crește cu un metru pe lună. Ultima măsurătoare s-a oprit la [[metrul 412]], unde pătura [[era încă caldă]]. Ministerul nu a căutat mai departe."},"adoption":{"status":"available","nickname":null,"adopted_at":null},"en":{"title":"Nine Lives and Absolutely No Boundaries","charges":"Aggressive cuddling; invasive bandaging; requesting location updates every seven minutes.","story":"Mumiau was expelled from two pyramids for being clingier than the curses. She demands constant reassurance, wraps her dates in bandages “for warmth” and calls it love. When someone asked for space she built a little shrine next to his bed, complete with emergency contact details and a backup key. The Ministry describes her as “affectionate to the point of structural damage.”","warning":"If she asks where you are for a third time, check your windows.","verdict":"Banned from asking “Where are you?” for a century. She asked where the appeal office was.","annex":"The 400-metre blanket was measured again for the archive: [[412 metres]]. It grows by a metre a month. The last measurement stopped at [[metre 412]], where the blanket [[was still warm]]. The Ministry did not look further."},"image_path":"data:image/webp;base64,UklGRrJQAABXRUJQVlA4IKZQAADQNAKdASogAyADPlUqk0ajoqihI7HpCRAKiWlu//m8F1zxEntm1hyLd+f+nYCasVl4AWYP/XdR25dGBqbUg/IN23IyYuL2/mmNfux54z4/py3C/m+85b1D/4Dfgf6l6m/TW5AHM+8f/pPB38e93JRB+f9qLuF/Lvvh9RT8n/rH+//MjMAfw/7Ceql+X4vmoN/f/TTxL6A36s9Wv/c8vf6P/u/YV/oP+KFXEuBPzgTsgJ2SzvnAnbXp2QE7ICdkBO26FrDygS6fBVc6nzJAndO0b7qtXaxeh5MkXhlxLdgH2r1eC8MvjV390zpNZVJGXUybDCLwwj4pxB+eM+Xc5vWN8t0t8B27yCJsMCdteu2dG+s7ZAXbLqfKMd4CXgcrY2qTB9BKvN1pL+R4ZfcgmbM2D5LaYQTxJXhzPvN2ZsJoE8S6mwwJ2QE/Xeu2TJsMIvHvTsgLpYk3BhiorygTtr0/Os7ZBCTq2IBK2VZUCQX97xGnJCeFFUICdbGB5JtXrFPDjfFgq7M2D01v9Ert/D6iMB+FUgu35KDVaZNJyoqBICdkufuZiFXulsgdIpwjY1ogOPReqViaZM s":"available","nickname":null,"adopted_at":null},"en":{"title":"Night Creature Unfamiliar with the Concept of Home","charges":"Illegal after-hours activity; nocturnal trespassing; emotional attachment to the dance floor.","story":"Batty Bălăceala treats sunrise as a personal insult. Every time the DJ announces the last song she finds a basement, a rooftop or a friend of a friend with speakers. She died on a Monday morning insisting the party was only getting started. In the afterlife she carries emergency glitter and an address nobody has ever located twice.","warning":"Do not follow her to “one tiny after.” Tuesday may already be gone.","verdict":"Assigned an official bedtime. She requested it in a different time zone.","annex":"The 08:16 houseplant was seized as a witness. Since 2022 it [[no longer needs light]]. It turns towards the door [[every night at 03:00]], as if waiting for someone to say “I know a place”. Last time [[it bloomed black]]."},"image_path":"data:image/webp;base64,UklGRhg0AABXRUJQVlA4IAw0AACQuAGdASogAyADPlUqk0cjoqaqIxOYiUAKiWlu/7q8A3NxI8/4x88T/Zr8X4f7Pnt2F2O+cf++353I9EhqNtk+2t/v8WApNCbtn0L3yfUhz9PVdztfpc6K/1mv5N6iHnT+tnkL3bvwL/cXuQ7jv0vuZfpeQVgO/kP60/LfkgDxVjWRH0b9Gf2B7B37BdcT9zvamEN8/hHEEYgOgdA6TkB0nIDoIuEB0DoHSiAHduH/PwsazNkJSNMJACQAk8LiwZrjWwVpOE1hNYsMQAPJ1Eb6sx1xAdA6B7F0oky9sDBuin6s8oE34+FAq5JsF5xiBmpmx4cCMQHQaIunA/aJsnewm4UQ+QkBDE5WEyskrJWiVg6LJWiVosV07E+Svqtu0StEsgSP4dkmo/NlBxnHTGYvpwN/l/lpPwqSS96zrpxGeZ5WLpOaboHqMO9uL98lqDAstJcU5CJZePXqRqV9THZ3LlYOiySk66EuiVolaJWEyuI37+5LYHshykS1uQKbVrUuflAHLP5e/6usHPsxjgiB5km4cB29RIREmyN09yPdzOkGWSbBBmo9rzSySlH7L8zTC7eQBEb+f9cWGBayZLDh3MP3cKmiDnuVoS5iD4OHR4Sc4kuKt2d3apnKrohvgP+G5Oqo+wjry5aRoGL6acgnRJ7+E5NuCtKefputv9Fn/bHdxbzALgxuEysSJTKxLolYUVKDmhzOiZ3RzlTnfrXBM7CVPQ+RDYiAwsNRD0G/rESkaqK1e9VpbkIRNgU0LatvqMS4SL1KhM0hyybppnT8SF4EEaJ9h+kRibf0vzWRyANV4lpSuKB42CCUENCdNGAoqdsx4i5aL60umLBd4izYfUWGIo4Hz9KAdE8JxqKVBS277O6XBwZvOAQM/Y8DDaxAj+Rfa7bRhfheKyCePZZkIzn7VOx2ygRk7jdk9KLpKDwkMo5pubK52PnBHDzNuaSYCusEeUbvGd MIAUVELIA","image":"Fantoma_015.jpg","qr_url":"https://nistoras.github.io/?g=015","ro":{"title":"Judecătoarea care a Citit Tot, Inclusiv Mesajele Tale Șterse","charges":"Dispreț premeditat; evaluare necerută a partenerilor; priviri cu efect de sentință.","story":"Miauvelia a murit de plictiseală la o întâlnire în care un bărbat i-a explicat ce înseamnă „muzică bună” timp de două ore. N-a spus nimic. A ridicat doar o sprânceană, iar el și-a șters profilul de dating în acea seară. Acum bântuie barurile din colțuri întunecate, privește oamenii două secunde și emite diagnostice neautorizate: „Are trei foste relații nerezolvate și pantofi urâți”. A fost citată ca expert în 74 de despărțiri; la proces a prezentat o singură probă: un screenshot cu „hei, dormi?”. Judecătorul a izbucnit în plâns și a admis dosarul.","warning":"Nu încerca să-i impresionezi cu povești. A auzit versiunea adevărată.","verdict":"Obligată să acorde prezumția de nevinovăție. A pufnit atât de tare încât s-a anulat ședința.","annex":"În arhiva ei s-au găsit [[2.874 de mesaje șterse]], fiecare cu dată și oră. Unele au fost șterse [[înainte să fie scrise]]. Ultimul din dosar e semnat de tine și datat [[mâine dimineață]]. Miauvelia l-a citit deja. A ridicat o sprânceană."},"adoption":{"status":"available","nickname":null,"adopted_at":null},"en":{"title":"The Judge Who Read Every Deleted Message","charges":"Unauthorized verdicts; excessive side-eye; possession of screenshots.","story":"Miauvelia can smell a lie through three walls and two locked phones. She judges your outfit, your taste in men, and the punctuation in messages you deleted five minutes ago. She died glaring at a man who said “I’m not like other guys.” She now presides over an informal court where a single eyebrow raise counts as final judgment. The Ministry has never won an appeal.","warning":"Delete the chat if you must. She has already backed it up.","verdict":"Appointed permanent judge of everyone’s business. Unpaid, naturally.","annex":"Her archive held [[2,874 deleted messages]], each with a date and time. Some were deleted [[before they were written]]. The last one in the file is signed by you and dated [[tomorrow morning]]. Miauvelia has already read it. She raised an eyebrow."},"image_path":"data:image/webp;base64,UklGRqA3AABXRUJQVlA4IJQ3AABwuAGdASogAyADPlUqk0cjoqioIzOYqRAKiWlu7+JMWWmdCVXdTs0riUbP//3UNtHRFacVILyMdsGNKbHt18q3m92h5zPSHoE9R/+k9Lz0+erPnPf+16u/2k6nz1pP496nvnfXyjOT8U+5fce/OePflX897mX575Kt4viqaz3ifZJPwHqDfzT/A+kDpjeufR4/7HZHEej2vi7PS5r4bdWczxEGKx7y5RLT3kOmtDU6B/juAd91kAp6ANamm6Kx+mIbmdSq+7dVSTJZVsemEaP8+P24en3Id2Me9SAi0qeNjbvF0efvcOq1md0z4hyHqkeG5JEKy25HS5r4voE+5pVSsRu8S6F1NinWgVifW2PR/mweVjRvs/H6WOnZ9QqZiowwK3M6mF5e56a1qnvIhwtFREFMDxo6UD6Jt+Swrmw9huCV8MMV2exKbe8lPaJWuhp1n2LDtecq7rt6CSxEly1YkXxVRL6PsvjpFcfP34/SxGwdLjnk2D0qGXvgAKZKw3+Id3SfUcYg3kht2/zj1F8gEOnf/diDLFOhGMNdS/u9T4l4Qta4/887uX+vWaiOGFJBPqF9G6m9AO7Iog5j+fQB1S3TC3Tx/Qy99g8n2/i1V90VdTyhTVng7F8TfopdM7GakHed4q/9zOi1xnp0m5/zoT4fwZg/oBS2WbdvQgfuTKx9vM9QTdH+bByXCyuy28bGdARJgNOha7TOkzM9Kulf1tY5yHLkAdPP9G/qp48s1SVdePHjLitqSzbtQQF2nogwtWyjO2f4wb7jI/35CIa14i+wkL//xhS+Bi9sq7tYkBr3UKFjZkykSTF362mA9xQ+sNwQ9Dq8btxes49iHOEyv/+/EmCeHl21drlDA5paKWucrZ+4UZv9t5/NKTPyBtzw9jxaJ6jdAaPtiA6XJ0mHXOOv0IuF1nIXTAFeR9lsTptQoRkoavVIMTIptlUY4D0ZVnLAHrQICajuXb7DiK0VXeYof2NBM3hHYgjfFS77v8zFdxdUq8DpFWl5kkGxki4ebB+0J+MDQxR0WKhgB2payq0BAjYPSGmyuBBceQR/GqvTmYZEgGM8KVh4WiPRjVH3RNkmnu3lyKf48xRTDvLxo5sMg/AwBvgXyfkJyggcRxc8Q+TVe5hTWfYAeI3gMDv6/uNxMqJiWBm/n1+5kSh+eX2vLkqpJY9Ubm/OF2lp7c6NricFye/O40r6vh8laLVvkIMnuGIM5oKe4NQM+AzcKK6VqqZNHvvbrA5xgwgsFZWdV92Y1RqFVjz+/I2BeN2VyFTh2qZHZzqDnl7Bt8a6n6ZlS4CUPZAZ0/WBH/9gJhZmqqtLAOlXut2QeuVYE8sxrAxBJtegjEYx2jv6YIJl4tZtFfYgs0em/xJ7n9H9MHQG31By/CaoeuqvtxLun/AfVD8ra4J0He1ZxwgSaso4Vi3f73dONCSIHZFUwGOaiLYLVtrb9htohtNlHZx36tIEvDpVsmBn968YjfH0ZjqFBqsHeHD2kE7fMl6Ggy4rU8XV4QoJQshiSd752WkewD9qIFeM0K8hWfaBCJ3lVoOaSPRLl3H4nM6YVrnHTSfPZMP1cbev8mTp0Mwz3YPJTGk0IORGPLAKYQyCQ8cC2CSnKkLx+/NZBxYyxxm8OKQz81/S60QE8XLaxnEEv7MI/staZNEmCkBbDoYEbfYalo tus":"available","nickname":null,"adopted_at":null},"en":{"title":"The Lady Who Prefers the Back Entrance","charges":"Improper backstage access; highly suspicious flirting; causing marital paperwork.","story":"Madame Backstage never enters through the front door. She arrives beside you, glances back over her shoulder and somehow makes you believe it was your idea. She walked into the DJ booth to discuss a “strictly technical problem.” Seven words, three Wi-Fi passwords and one divorce petition later, the problem was reportedly solved. The Ministry still cannot identify which mixer was being serviced.","warning":"If she says “Come help me backstage,” ask for a work order.","verdict":"Must flirt at least two meters away from Counter 4. Compliance remains disputed.","annex":"The door behind the DJ booth was bricked up in 1994. On the building plans [[it never existed]]. The [[11 people]] who left through it with Madame Backstage are listed as missing. Every morning, in lipstick on the brick: “[[It wasn’t locked.]]”"},"image_path":"data:image/webp;base64,UklGRsQyAABXRUJQVlA4ILgyAADwtwGdASogAyADPlUqkkcjpzElI9SIeiAKiWlu/906J6HiSlucdH0S2RyAK4dfi+5/rzS2++9B0z/53Vf/nuL6LfUDpDZ1D/NxX9k+VMIbPj2k/s+f7AH6fv7F6OPp59TH/y6F71FdED6yP9B9USyXZv/i/Sc3L/pdW30xmyWpP/evMj6UulcWP16lEMHkOpOTukDXToUeQ6scaTuxDqc3Bd3Aj3mcFV7C6nl9MKzewA1qsEr3Z+HhmDRj7vPs2rXcLmJpUMf0baA9U0nd67sNbJdqZRDhcydCFh4wwRk/k3q8TdOUxKB3rBZb3YiBiofQ/y1hpcg/3Ebv41msKc3n0VhW5fOoQp0FqrztDDZIJuw3Va/7s/DxV1lX1LleoAet72mbv7SqTk1XlcRH93rupPitutUw/EeeKasODAE6Bqg/MuNDjtDc8yEBYsEfurYTRfK4zJTVDtTKv31BZnumFbmhaq8ftIVRK2GBW3rxE7+TWidSdCjuTte3QDRd67VQaD2SmL9BKt2MsJH0zXiQfYZfVKQpn018gX2q6Pwx/t1CG/Fd4KFzvp4tVY9clIDvdn4dxnD2vXNkIrO1SuYe4DhJJPtybB4Cwua1rKKoTEVArc0qbqpa+BZMq/aNW5fNzxTT9hk0pcaOac1D2rF+coUa+THzZghAGV/jqawGxv7o6PTNTctvVVLAAH+M3zVl3avwvZrTWTmpsU7rqomPj3VGuUWHC3jEyacmMtraqENOWVtg27mMf+OyeZ/C0cjBd4+qGlPVDmAGBD/ZdRMAQ/9RKoiiqPJyUyvCjKOHuwRpx/xKLaE2gAIWkrAk6B352U/QelOpORSEdrcf43Xr5uaebfZoNqJF0maz//6XXpcRoxxVFzpSOnm1QQFjol6DaOH32giv+ mâini și a oferit evaluarea anuală a familiei în două semne perfect sincronizate. În viața de apoi, este chemată când Ministerul trebuie să respingă o cerere, dar nu vrea să plătească hârtia. Este singura fantomă capabilă să spună „Nu mă interesează” și „Du-te naibii” simultan, fără să scoată un sunet. Într-un club i-a comunicat fostului că l-a iertat. A ridicat o mână. Apoi și pe cealaltă.","warning":"Nu o invita la cină cu părinții. Are două toasturi pregătite și niciunul nu este potrivit.","verdict":"Transferată la Serviciul de Relații Publice. Satisfacția cetățenilor a crescut suspect de mult.","annex":"În toate fotografiile de grup, Dubla Ofensă ridică ambele mâini. Expertiza a numărat degetele: [[sunt trei mâini]]. A treia vine [[din spatele fotografului]]. În poza de la ședința „Suntem o familie”, [[a treia îl ține pe șef]]."},"adoption":{"status":"available","nickname":null,"adopted_at":null},"en":{"title":"Deputy Secretary for Bilateral Communications","charges":"Two-handed insubordination; diplomatic incidents; simultaneous gestures of disapproval.","story":"Dubla Ofensă mastered a rare skill: offending two departments, two lovers and both families at exactly the same time. Her official portrait was rejected for showing insufficient respect for the photographer. She appealed using both hands. Now she appears whenever someone says “let’s all be mature about this” and proves maturity is optional.","warning":"Do not ask her to pick a side. She has two, and dislikes both.","verdict":"Sentenced to diplomatic training. Both instructors resigned.","annex":"In every group photo, Dubla Ofensă raises both hands. The experts counted the fingers: [[there are three hands]]. The third comes [[from behind the camera]]. In the “We’re a family” meeting photo, [[it is holding the boss]]."},"image_path":"data:image/webp;base64,UklGRso0AABXRUJQVlA4IL40AABwnwGdASogAyADPlUqkkajqaYjI7QIcTAKiWlu9CaUUv1p605FX6X6Xnn15+/O8L1a+n/8NwfQ8aaFHjzmPznbN/4mKL8HQN8k1b23fPzgp9Pv+u9Lj08+o/nWfS  prezentare PowerPoint cu 84 de slide-uri. Comitetul Suprem a clasificat-o drept armă de distrugere emoțională în masă.","warning":"Dacă îți spune „Nicio problemă”, problema este deja la avizare.","verdict":"Obligată să vorbească sincer o dată pe lună. A numit obligația „un atac personal”.","annex":"Emailul de despărțire a fost trimis în 2016 și [[se retrimite singur]] în fiecare an, la aceeași dată. Lista de CC crește: anul acesta are [[94 de destinatari]], dintre care 31 [[decedați după primire]]. Formula de încheiere e aceeași: „Kind regards”."},"adoption":{"status":"available","nickname":null,"adopted_at":null},"en":{"title":"Ambassador of Passive-Aggressive Peace","charges":"Weaponized politeness; polite insults; excessive professional disappointment.","story":"Fuckina Diplomatica can destroy your confidence without raising her voice. “Interesting choice,” she says, looking at an outfit that took three hours. She once ended a four-year relationship by replying “Noted.” to a marriage proposal. The Ministry employs her to send rejection letters because she can insult an applicant in twelve words and still sound elegant.","warning":"When she says “With all due respect,” none is coming.","verdict":"Required to offer one sincere compliment. The civil service is still waiting.","annex":"The breakup email was sent in 2016 and [[resends itself]] every year on the same date. The CC list grows: this year it has [[94 recipients]], 31 of them [[deceased after receipt]]. The sign-off never changes: “Kind regards”."},"image_path":"data:image/webp;base64,UklGRvYvAABXRUJQVlA4IOovAADQnwGdASogAyADPlUqkkcjoqylIvO4kZAKiWlu9+xOvJtCskF5/xjK2Px4q9tfv/D/I89WwutF0B/x2+e4Poh9Lijl5Fu2z/y8WKCOOnkHy+Hv5x/2/OZf29TP949Ir04+pb/y9CV6auia9aP+g+sl52F869qfVN8T+3fcZ3JLqPWX/n6IpxW8mx7D9RfXPuW+RE+/+oV/K/8V6Mek96zB2gjIm7qRLiXEuJu6kTd1IlytJcS4lxN9Lw+ikRNUvfvGns/z35bwpImEGietgpT5TBkAiNDaxAPIO43uwqJft0wM/J+UV0+sH6rbm1Tix3xh073G5sjWOELr2m5Qb5cY1deDpuUIzRVj47Nyd7Cbe1D5CJHBYcuUc8mPKXylaTPKXyl9IjF4rx8RmQQ37 erut imediat formularul pentru revoluție.","annex":"Bonul lui de ordine avea numărul [[0004]]. De atunci, Ghișeul 4 a strigat [[toate celelalte numere]], niciodată pe al lui. La fiecare tură, cineva din sala de așteptare pleacă cu bonul 0004 în mână. [[Niciunul nu s-a întors.]]"},"adoption":{"status":"available","nickname":null,"adopted_at":null},"en":{"title":"Commander of the Revolution at Counter 4","charges":"Unauthorized coups; clipboard warfare; organizing queues into militias.","story":"Generalul Nerv once waited six hours at Counter 4, only to be told he needed Form 69B in triplicate. He declared independence from the waiting area, printed his own stamps, and promoted the photocopier to deputy minister. A small but furious revolution followed. He now carries the grievance register like a battle flag.","warning":"Never say “Please take a number.” He will found a republic.","verdict":"Condemned to queue patiently. The regime collapsed in eleven minutes.","annex":"His queue ticket was number [[0004]]. Since then, Counter 4 has called [[every other number]], never his. Every shift, someone in the waiting room walks off holding ticket 0004. [[None has come back.]]"},"image_path":"data:image/webp;base64,UklGRtgtAABXRUJQVlA4IMwtAABQoQGdASogAyADPlUqkkcjqaimoxOYmTAKiWlu/848G6chuCFM7Axwb8/Pr8X3uVW+u5F0L/33Vv/huI6JNwV5EW2e/w8XBCOQHjPtPzqH3fUj/d+nZ6sedS9OvRH+td6EFk9ztvFfub3INyiUI+08atxYakbQA8YHSK9a+puD5PXDOIJQuLVcNMl/kkqwuLXk3AepfINaSsdBTbI7C/vHGaQVvOnGQfYKWIyFLBSwUulJdKXSmyBAwhDf3c6MQswepfIK0xbv7a+92J9WiZbkj0d+8ta5U4fQl5uHSUq7zmupza7tAiUJDzdUF59W4UxBHZ7DE5WNjSo0qYqmDGkqYqmKwX09Ne7iJCP3X92AnhtcCXZEKXyLWqbBPH9iYnvxP6ndw5sPUzkXKtXTldFhJKuL6nSfpvbFdca821w7qMOaqxEEjyetBOkjdOU5QxtjKo9n2B9gpYKWClco+31MVawpe5lvmxf4V1I8t10ZXRBQBThrITbT3G6M1zr9xBGZJy7VBmp46Se4lp7Uz9biC6/v1WVuGbyfLQuOU9E3t/FIkso35Md7r+68+pcA2xPsWIP0ns/OZwj4QaNqgFw7lZ6lR832RLi30+uUez65R9UsD4gKtpsVRqZgpugmixur5sMqMtt8IYziYo6CGsagiyVmDBFM4BFErYRerBPE/pHgl7vBYkxSC9nqSKAbLjBEVqVKQ2es6hV5Zf4HpeSYpcUrAu61erc/F1bS8H+aDdn  sunt genul gelos”.","story":"Pufuleț arată ca o reclamă la îmbrățișări gratuite. În primele 24 de ore îți spune că ești „diferit de ceilalți”, în următoarele 24 îți cere să nu mai vorbești cu ceilalți. A murit într-un accident inexplicabil în timpul celei de-a șaptea „ultime discuții” cu fostul. Ca fantomă, își face apariția cu ochii umezi, aduce prăjituri, îți spune că adoră libertatea personală și apoi întreabă de ce ai dat like acelui băiat din 2019. Ministerul a găsit în camera lui o cutie intitulată „Nu sunt posesiv”, plină cu 63 de chei de rezervă. A motivat că sunt „pentru situații de urgență emoțională”.","warning":"Dacă îți spune „Eu nu fac dramă”, pregătește-te pentru sezonul trei.","verdict":"Fără acces la localizare partajată timp de 200 de ani. A cerut pinul judecătorului.","annex":"Ministerul a încercat cele [[63 de chei de rezervă]]. Toate se potrivesc [[la uși reale]], în 63 de apartamente. În 62 dintre ele, locatarii au confirmat că [[nu i-au dat cheia]]. Al 63-lea apartament e al tău. Locatarul nu a putut fi contactat."},"adoption":{"status":"available","nickname":null,"adopted_at":null},"en":{"title":"The Angel Who Destroys Your Life With a Smile","charges":"Excessive cuteness; emotional sabotage; concealed red flags.","story":"Pufuleț looks like an angel, speaks like a lullaby, and leaves every date with a three-act disaster behind him. He tells you “I never do drama” just before introducing you to six exes in a single bathroom queue. His innocent eyes have convinced three judges to dismiss complaints. The Ministry calls him dangerously adorable.","warning":"If he says “Trust me,” document everything.","verdict":"Officially classified as a red flag in a cashmere sweater.","annex":"The Ministry tried all [[63 spare keys]]. Every one fits [[a real door]], in 63 flats. In 62 of them, the tenants confirmed they [[never gave him a key]]. Flat 63 is yours. Its tenant could not be reached."},"image_path":"data:image/webp;base64,UklGRlgsAABXRUJQVlA4IEws ea suspectă a Formularului 69.","story":"Onan a fost angajat o singură zi la Arhiva Paranormală. I s-a cerut să verifice dosarele, nu să se bucure atât de tare de conținutul lor. A fost descoperit după program, în spatele unui paravan, susținând că face „o expertiză tactilă independentă”. Comisia a întrebat de ce avea binoclu în arhivă. A răspuns: „Pentru detalii”. A întrebat de ce formularul era mototolit. A cerut avocat. În viața de apoi, pretinde că este „un simplu observator al naturii umane”, dar are șapte ferestre deschise și niciuna nu dă spre natură. Ministerul i-a închis definitiv accesul la vestiare și la arhiva cu imagini. El încă întreabă dacă există versiune premium.","warning":"Nu-i împrumuta laptopul. Și, pentru numele tuturor sfinților, pune parolă.","verdict":"Activitățile de inspecție se desfășoară exclusiv în privat. Fără spectatori, fără camere și fără decont.","annex":"Binoclul confiscat a fost expertizat. Lentilele [[merg în ambele sensuri]]. Prin el, Comisia a văzut o cameră cu [[șapte ferestre]] și la fiecare fereastră [[pe cineva care privea]]. Expertul a predat binoclul și a cerut să lucreze de acasă. Cu draperiile trase."},"adoption":{"status":"available","nickname":null,"adopted_at":null},"en":{"title":"Inspector with Sharp Eyes and Busy Hands","charges":"Unauthorized private inspection; suspicious use of Form 69; excessive curiosity.","story":"Onan worked at the Paranormal Archives for exactly one day. He was hired to inspect files, not to enjoy inspecting them quite so much. Found after hours behind a screen, he described his activities as “independent tactile research.” Asked why he had binoculars in an archive, he replied, “For the details.” He calls himself a student of human nature, yet has seven browser tabs open and not one contains nature.","warning":"Do not lend him your laptop. And for heaven’s sake, use a password.","verdict":"All inspections must be private. No audience, no cameras, no expense claims.","annex":"The seized bin trical sighing; declaring apocalypse after being left on read.","story":"Catastrophina has never been dumped, only “betrayed by the universe,” usually after eleven minutes without a reply. She died on a velvet sofa announcing, “Tell Mother I loved too deeply.” Mother was shopping for groceries. Now a simple “ok” becomes a three-act tragedy with violins and an intermission. She has gorgeous outfits for every stage of grief.","warning":"If she sighs, do not ask what is wrong unless you have three spare hours.","verdict":"Required to summarize drama in two sentences. Collapsed theatrically after the first.","annex":"Her mother was at the supermarket. The till receipt is stamped with the time of death, [[18:40]]. The store camera shows [[two people]] at the till: the mother and [[a girl in velvet]]. The cashier swears the mother was alone. The girl on the footage is sighing."},"image_path":"data:image/webp;base64,UklGRlZEAABXRUJQVlA4IEpEAABQEQKdASogAyADPlUqk0ajoqGkoxM46JAKiWdu/8s5v1xxEns81dyD649gW/1/ozJDcJ0//XdM25dFdqwUg/M1dEw+Da/Wr3fmKNvzb/s+dR5d/Pee/1Af2Pz7fX16kv/B0MPpj8oD1iPWR/rPqq+c/63Pp/6YxNX8a/w/+L3H+rXq4MHX58ld4C/5jv5vZ+ZB31/6XId9rvNv8ZDyYKA/9A/1nozaLHsj2FP1035gU0aMQJj4xZfzMWHMqZuKI2w22G2w22G4s9J0D/w0Y0sOSDz2GJSr5Y0uVVuR/fJGljS53enreCRFxuxpcrDAE9V5ASjCF9wXuDGV02K8c+tBIclDB+bbEmGMAv0W4Fjmw22MIuL2fiHgvcJrGticrNiS7j8wBd8Gxz8PJhT7r83RC2iVaxpdEjS2DZrS85iPUmFYGyCM1pnMPGIB6GdCNAb4L3BjK+JG2G4ojbEnBSHI1v5oeGh6Jv5oScAydscklK3MRyKZ7R/kfvpyiH4HCoGBJScLUdW6+7ZwtpehsaXRCRCf3l0RheTAMirG0hWuhf5jbDcWgcCfNDhfVOfeUQwjo+qmZXMNw0l3drbNg1yUTgOGIpgiEu4Il5alJ0zi08di4rYyWXLEtkCS6Gav5JjXWK5TbVkwrA0sLgS/eaO5gGNrNj47ooDqvlff4cvU1YGxqYDN/IEG43tX3ghmqV0NkEhavfkLgWIIX+cme3bJVUCBNAeoxtbmA371XNMigjgFMz+vuP7jYvxTr3PX5MDSTu6BpGfCvA9gzjq0NlEC9jpnUdfaAJR4uIJ3qmjqr71k8tWB/utOb3Ev3avZfzLk3s+zDGHg8wyTbfMA0mnv7o5OGD93uaw8ckC/gX5SMygAxo1a33mXOhTundqBd6uvA7tfxpB98EObYdzzXSmMyR9YgzMA89jim6m9+uQV+uA2czUJehTjSkFR9WNwJKR6iMPf8HUrvJLzxjyrY4QraXY64FkzX0ULMQ2yYIWuhGBglNZFlZdw7HWSDWwZaNEhI0Ary8OpIW9PGk86pUrvnaAZ0 face-to-face negative reviews.","story":"Degetina de Lux is Mijlocica’s distant cousin but has significantly better nails. She died after an influencer asked whether she liked his outfit. Her pause and one perfectly executed gesture ended three sponsorship deals. In the afterlife she works as an image consultant, though she has yet to approve a single look. Asked to be kinder, she said the request would need to be submitted in duplicate. Both copies would be rejected.","warning":"If you ask “How do I look?” prepare for a verdict, not a negotiation.","verdict":"Ordered to give one genuine compliment daily. Requested postponement until the apocalypse.","annex":"Her manicure [[has not changed]] since the day she died. Her nails, however, [[grew 2 metres]] and are kept in the archive, [[freshly polished]]. Someone does them every week. The Ministry has hired no one to do it."},"image_path":"data:image/webp;base64,UklGRmowAABXRUJQVlA4IF4wAADwowGdASogAyADPlUqkkcjoqilIxPogRAKiWlu/6o6Y6gB4iGs/4yu8T/BsC3335/nm2F1tOlP/O6v/99wfQ2aYlHPyONsZ/e4uCG9U5nflEPfyvy+H6fUp5OHp39R/OvemrolPWP/ofqu2UDPA8X+3fcfwkv5wkVoizhGCM8R+wB+rnHcfhPUI/oPm36RXrv0e+t2ET47ZQb2ybk3JuUG9soN7ZN164Nwbg3HUhremJrH5xR9CfAqWuPeWCtQx8cwY+GPhj++n1NrxZaM4r1rA4JaZltUDMYYxqjJUDJjRxXApZoeNqnGIjCeyS8MrDDGNUf0xR/Y2xtlcmjcLQeNsiOCW/hASF6aFo8kSbiBYJz+Kwsnwx8Mgn1AHfzAfNd1UqPCWzX5mLX7YghEBBP30DKwfdMqMqF7a0kCTGp1Ql6R4I6xZsBd0QT9ywd0j86M0qM3thPMGOkEhws+pT8egydRsEB7RnZhqFahj4Y+GPcTXKsEW7CpT+3toNH+ns7N/708pZTy1LGI3FXo//J763xLtUzWLjAzuWvAm7iONmgSTZvB5wqE6m4yOzOJ8zu5CNCQR6w2ShtfBqLy1LirbEVbekoTj96OYx+YWVbA5/E0ViKPhj3E6+G8+94cGNxqS5enqFTEIAcNDyMP3vfCOAKhjWsSS8T3Wr8i7qnXaPI1uZqAiA1rTiasNOJrcfCsa+3pINof4MFcg30tAHOLsRsCw6LqgDt5qNisDuGnEv1NgS1DOhVGnE7INiagolfcNifNCAO5Fo+ogPo1b4nfI94vxr5vfgAZ0nu32iV54h0WeYdpNazTwUwO9OScYYKnq2FhiPwq4uvx/cW+R0yqAQsDRUcrX65rN1zik7QVUwsyCbu1gynUiKvkazUJinYRXRc929+IVoYxbQLzoe8+4V/knVNhvE8s2MqmgVZ1oIXHV9xuZDZm86aSxxuwqSLFz7b+8/4ssZzICsR6PqcYdh0AFxD5yh98ETn8dbsZVJ6mJwdV90Ws2ptbZrdJRYrX1pF8MxHUgaWCXC19J1ZzEt4wy s; unsolicited debates; aggravated use of “actually.”","story":"Țepușica died explaining to a traffic light that red was technically a social construct. Her last words were “Let’s consider the other perspective.” In Purgatory she launched a podcast about misunderstood demons. She interrupts the DJ to explain the difference between house, deep house and what people call house. Her dates frequently end with PowerPoint presentations explaining why their answers were wrong.","warning":"Never say “Everyone knows.” You have just activated a conference.","verdict":"Banned from starting sentences with “Actually.” She disputed the definition of starting.","annex":"Her Purgatory podcast has [[6,666 listeners]]. The Ministry checked the accounts: [[all of them are dead]]. Next week’s episode is called “Actually, Hell Is on Earth”, and it already has [[one confirmed guest]]: you."},"image_path":"data:image/webp;base64,UklGRqAsAABXRUJQVlA4IJQsAAAQpwGdASogAyADPlUqkkcjq6qlIzQYmXAKiWlu+CUvxvzbi8/4ztcq/Bkq60TjrMf/zuof/TcJ0SbfvyKNtP/h4uCGsbWC8XraHn+vxepT+vef/66PV1/8+hJ9LXkAdd1/W/UrsoGdP4p21/jn6nkBwNcoO8S5OL9p86z7TzV/ktdzoCeMPo4+tQfh8xbMReAHqlld3WwD7DLXdQcHqlld0dg/hKA/grTT+fZcODXSqRnsbMVTo9qpiqYq0fNebqpEpXghdNkU+/wQCpnw0ssxF9I+ADWFX8bnwRlq5tQUb6MeViYSNHYRSsVYf+w0z5KWrED/LWGlyDDioLvCqhLdQsPD46XVTFUZY6VTFUxq2zmmLIS7CvnUKWKA83ZUWm48APsRUMQsy60oMx/YZiE+SGWvDTPBcgH1shbDw5X1S82WmaODI15tsNU0ECPgyeYBrCuDZLKQMT2fm5n2GErVgBrVTFUxVGku4p/OzCqYMdxO1cbklqw8NOYA/zdQejUQqRD+0Z+SXB9zu/Ob7ZZPKxG28ChU0HY9BbiDa/v11V/2FD7rNdV5Pks7MrYOl0IHhtDFUxS6P9HieFQ5SqbQlLF+HhgQbICQmURuVvVyPdDMaitWzYAE4m4uZ9dvDzYOksmxDjU12m3M4VY8n0061NkrUxXWFGQDk1g64ql9u02Fyc1BGF4yzvOWNsoNHSUGfhrE/oyBvjV8ZS3NjwHvpvipyp5Isu2gA/ICcYTL8j9GTEx3J4XL+sXyqySoZRMvxiZFWN+FA6VqXm531MG6PmnTvX4BNEv92f3FUw1/PnJsARUMfm/qVMJ0Rzfz30DclW223/8OYOVwmS6p8+LUsrAThN1R9yPOv3ph8JwCnViEg1kgxwulASdcvlWm4P6hbWFZipdrteZxjapKOb1mQAdHhrUKbNQM7p/hf+ppRsF+bOdrOBJZcrQEzrdHR7d7ycPg0m8Cpzg6XCo8Kri3aSCrr3+6LZ0Qk/ONVLu5bKnFtp7wzhYFgsEkjR+qllG5DZVlOSCYowZRzfWzERpVPB6Z2EmM te this for someone special,” then performs the same song. Her world tour currently operates between the bar and coat check.","warning":"If she says “Just one more,” check whether she means a song or an ex.","verdict":"Amplifier confiscated. She started singing a cappella. The Ministry regrets everything.","annex":"The audience [[did not leave]] after minute nine. The doors were locked from outside. The club reopened in 1996, after the discovery of [[89 torn tickets]] and [[a guitar still in tune]]. The bouncer says he locked up so she couldn’t leave. The solo never ended."},"image_path":"data:image/webp;base64,UklGRuRCAABXRUJQVlA4INhCAADQ0wGdASogAyADPlUqlEcjoqSlIrMoyKAKiWlu9/qLaqLLWF19x8a59gJ+5/LzSuYJp//3dV22dEzqAUgPIe2zYzlZVotuYjj88u1vPVfq9Pv9u9Hj0z+oL/r+gDzdPTX/d/UA/w39m9bv1Zf5b6mXnRetJkIXa71BfFf6T/bfsN4HvdFhqeCX8x/JkgHAX/K/69/weGNAb9hPMv+489NLXoD/qT1df8/ytfpX++9hf9hN+aEmOR4dIq3vIdMEegbWL5niHWexr4brFwhyyw9gX7XTH6etkJJpuziwW1W57JStVfdn5oSaborHH0nKbpTThsEMydMEeQ6uknpuxZasQi+lp4D0wgwiQ+L4H6WXUdWQ3jNY/bJ3kOm7Q17krTyAmCrtPqL3DpWhaPR9vN0Vj9LDHAjWqvu0MNmE3bkft8fuz8frdn2gYnqWBASFgUxY0XxcbfSLDd8RPjMdMIPKRdE8WmCbzdQbiHY4aJWuhp0fdqIhfiIbXBDyci4mnfz94CXvWVjRvs0M6V3WDytVfdmk3W77tBVpVZv/IvV1+XVb4zHH89mrBo8jmLq60jcRU22uKrs1oPdirbJDpFX1S0KbqoucVn//ofMgGeDXBDXdyh+DF9XZFEHMfz545loaufUC70jYAaXS1y1n4/R+0amcTWkDyJmxaQ2VPQ1HjnKJBhC+4/Sisj4c8qew3dCz71O7k6BnIUL1xxn0QG767rB5Fys25g+bKM00iCmbTwtJKJ3lIfBy/By7x2FVMlXLl+TLS41WXeZeBfq58AKY1P1J4RR7W95BcTSPJsljfZarPoIlo6uoqqBA3AlpibAGxf0wgsT99YMP67QNaIqA9sYnaFCjWY3rIR7jpN6qW3FYyBCm2UEgYjMbOdrbYuTVaLjCpNm0xd7u+j0nFu3KPQWNYTX5WBQAo3OPyg4NMm0oPAvAh/OskmYIeJePCXh1q4JsRgqSt8Ay0MCsVkfSw3tm7NtHXq+0XrziYz2fEluJ8kZ1Vsl5NY5B3Q37nkkOt8zSvv1fJxoDFXLbaHjmGkdZ9L6KAHiN4DINyP+Hx+SkslsHKkiMvBPi/vsEaeO0Yc+yZhuzBgL2pR/BKJ95HgD0JCW+5aNqaXXpu5awOcYPILBWVfVfP2NUahVY8/vyNgX0mhsAd0RsU1vXRWdMbo0Ltj0BQLbpYEcwwQG46xxxs52Y04x9PxrnAMFhkJOJdlI0k/YLElbs4Z4fmhKvpYQLd+FB9cMmVpntQ5v4fVBFdodHQs/8Uf4jIWbf/ClKewkcyHETBj4Fyv24itLfF508ZDE5fmMPHYve+O4QQMm2S22cDqNpFGRljNyZitqPblGCFeJnH e nici nu era înscrisă. A murit după ce a pierdut titlul de „Cea mai modestă persoană din sală” și a cerut renumărarea voturilor. În viața de apoi, participă la orice eveniment cu o coroniță invizibilă și spune „Eu nu concurez cu nimeni”, în timp ce pune discret piedică rivalelor. La ultima petrecere a promis să sprijine toate reginele. Cinci minute mai târziu, a convocat Comisia de Etică pentru a verifica genele uneia dintre ele. În dosarul ei, la rubrica „calități”, a scris personal: „Toate. Continuați pe verso.”","warning":"Nu o lăsa să aleagă cine face poza de grup. Va pune restul lumii în fundal.","verdict":"Obligată să poarte o eșarfă cu textul „Am participat”. A declarat stare de urgență.","annex":"La cele [[trei concursuri]] la care nu era înscrisă, câștigătoarele inițiale [[au renunțat peste noapte]]. Toate trei au declarat același lucru: [[coronița strângea]]. Coronița invizibilă a fost cântărită: 666 de grame. Pe cântar nu era nimic."},"adoption":{"status":"available","nickname":null,"adopted_at":null},"en":{"title":"Beauty Queen Who Bought the Jury With Glitter","charges":"Vote tampering; confetti sabotage; fraudulent claims about world peace.","story":"Miss Congeniality 666 won seven beauty pageants, including three she never entered. She died after losing “Most Modest Person in the Room” and demanded a recount. Now she arrives at every party with an invisible crown, announcing “I’m not competing with anyone,” while quietly sabotaging the competition. Under personal strengths, she wrote “All of them. Continue on reverse.”","warning":"Never let her organize the group photo. Everyone else will be background scenery.","verdict":"Required to wear a sash saying “I Participated.” Declared a state of emergency.","annex":"At the [[three pageants]] she never entered, the original winners [[withdrew overnight]]. All three said the same thing: [[the crown was tightening]]. The invisible crown was weighed: 666 grams. There was nothing on the scale."},"image_path":"  blochezi.","verdict":"Obligația de a asculta fără să factureze. A cerut o consultație juridică urgentă.","annex":"Notițele ei de ședință au fost confiscate. Nu conțin diagnostice. Conțin [[adresele pacienților]] și ora la care [[dorm cel mai adânc]]. Lângă fiecare adresă, o bifă: „vizitat”. Ultima bifă nu are adresă. Are doar ora: [[în seara asta]]."},"adoption":{"status":"available","nickname":null,"adopted_at":null},"en":{"title":"Cat Therapist Billing Your Trauma by the Minute","charges":"Therapy without accreditation; payment in tuna; unauthorized diagnoses at parties.","story":"Miau-Lisa died during couples therapy after determining both partners were the problem and billing the cat. In Purgatory she opened a clinic for “healing through superior eye contact.” She listens for twelve minutes, purrs twice, says “I see a pattern,” then asks if you can pay cash. Her diagnosis for everyone is “You chose badly.” The Ministry finds the accuracy alarming.","warning":"Tell her what happened last night and you will receive a bill and advice to block him.","verdict":"Required to listen without billing. Requested an emergency legal consultation.","annex":"Her session notes were seized. They hold no diagnoses. They hold [[patients’ addresses]] and the hour they [[sleep most deeply]]. Next to each address, a tick: “visited”. The last tick has no address. Only a time: [[tonight]]."},"image_path":"data:image/webp;base64,UklGRihIAABXRUJQVlA4IBxIAAAQDwKdASogAyADPlUqk0cjoqQmopHJENAKiWdu/7A5b25xFburdx2w+OJXTsMlSaxjr7P3/zupbcOii066RPmy/j22MGck1Ut545xlCfs9hW9PH9Q6dPqM/9Xoz83f0sf2fptfV9/q/q0+dN63WQPzXPGPuR3H8Jt+tZEuAp+U/2P/Z/btzHs63h//5viza8GQFxDVAb+a/7P0ctD/6L/t/YR/X/9g+17+7ftVfuUKinbCPl/H6v/V/7FfrAb+P1gzlQzaGbRbLt3biVhLekNog5yem+PAal7bcFkkvkOGwB4oArjdgYeh1cRwq68Lm1o2hm0M58OdS7P965eBWlEW1hQDjkd9JnpvpSO5zmIlD8mH/q/9jL5Us4TYdz4UmEf6RzSnoFYo8BA/kdvkyuLQJL5DhsmwAFm0HKWd6fIcNisdSaQ/5BGr/+jq3PuW5vyLh5/bIkMxkzAeulKo3kjwpy5kE3fwP2k82j17p33VRncLQCRxjBhPJGfaNsl7rkG4ak7HbX91zljS+Q4a/5HOv7A2QSF ","charges":"Catfishing; sentimental surveillance; close-friends algorithm manipulation.","story":"Pisi Venom spent 36 hours analysing who viewed her story and in what order. She now runs nine anonymous accounts, each with a different zodiac sign and the same opener: “Hey, do we know each other?” She insists she never stalks her ex, though her Excel file lists all his active hours. Once she flirted with her own fake account, fell in love and then blocked herself. The Ministry discovered the victim, the suspect and the witness were all the same cat.","warning":"If “bby_angel_2003” follows you, do not ask where you met.","verdict":"Sentenced to 100 years offline. Already opened three appeal accounts.","annex":"The Ministry shut all nine fake accounts. The “Hey, do we know each other?” messages carried on from a tenth. The tenth account [[wasn’t made by her]]. Its profile picture is her, [[asleep]], taken from the corner of the room. She asked to be left alone. The account replied: “[[You aren’t.]]”"},"image_path":"data:image/webp;base64,UklGRjBIAABXRUJQVlA4ICRIAACQHwKdASogAyADPlUqkUajoqohpXPYsUAKiWdu/7fl7zNot+biZvRXrPk01w5LBps192euj/++6ptp6ITTuo/+az+TbZUXaXFWNPyRFbH9Re4f/6no084j07f3L0mep2/tO/Y5A/8L7jH3N7j/u00Djnf55+ms0nc/+Y+JN+U/rLvr/KUzv/0fFO14FlOgJ/Sf8j6OWj36/9hX+a9VYPqP/m3RIvyuRfuiX8sTnKi/zhkzdaCYnB0YATNYAPX4ZB7K+ZiBpxtWV+Whgd2qJwuk8NQUadZ47KPSv2V9V3ieyt+1n4xiQyXmzCtBRKqGHn22WUtVzmyu6TaoJJ0GqQa66Ndrz1tE4EjtKGYy8lv1/5tLsG/R/q29hJ0fsr6ryn2E5NFGdZX5juXE6rLzAkGqqwJhOTUmitSkEuRflcjDXgN4+/5swrUBro12vObLdixvMImBsR2nDitBMnGiqNRhU7TRJehaloRAQy5xO89raA+uaCcazjagx8s332E5NHF9nROCON+xIkmwC7A5frwpcwAYMayETShk1tru9l1pSfLoNDi4H5R+DOZ8FTIZkdLOtdsHsZdVRzkHD+UGqQbFOkES65zWLjOQqC/4a0xyX/4A+G1AbADsGVHOhV6G2bXMANMsSJfnhpoW0zJp2k4Q9a5nG6dfNQEbIvP/8Cyw+GoKTBsfeaqN3PJ6W8Plu7+OS424tTvu8KN+Mh7o2jp9zFk4If42VfzhTfCXaIjfsxZyBmKNIy78xKWiESYT56wz/dOGjwBdfQw3AjjLevN5nZTyU+/uR/wS4HqRTAYx0TJbo089L4Ls/mSz10uOmgzVdliWg4aBfEw9oUABzvVNo+Tl0/oPRrG9x7vNQUh65eBrCF7x+tczDHL+VurOBlhFwxgQZuYlyuViqBigCPI8qhV+4 <script>/* GhostFX (horror v2). Optional layer: without the CDN, without WebGL or with reduced motion the site works as before.

window.GhostFX=(()=>{'use strict';
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const AGENT=new URLSearchParams(location.search).get('agent')==='0068';
const SMOKE=['#b9a6ff','#7fd8c4'],BLOOD=['#c21a22','#8e0f14'],SMOKE_BRIGHT=.3,BLOOD_BRIGHT=.6,FORCE=5000,IDLE_MS=9000,DPR_CAP=2,BLEED_MS=1900;

const NS='http://www.w3.org/2000/svg',$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);

const fx={glitch:0,touch:[.5,.5],tStr:0};

/* smoke behind the page (webgl-fluid-enhanced 0.8.0); colour only through colorPalette: a hex passed to splatAtLocation comes out blown to white */
const splat=(x,y,dx,dy)=>fluid&&fluid.splatAtLocation(Math.floor(x*(window.devicePixelRatio||1)),y,dx,dy); // the library divides x by canvas px, y by CSS px
function wake(){
 if(!fluid)return;
 if(ctx.step==='agent'){if(!paused){fluid.togglePause();paused=true}return}
 if(paused){fluid.togglePause();paused=false}
 clearTimeout(idleT);idleT=setTimeout(()=>{if(!paused){fluid.togglePause();paused=true}},IDLE_MS); // ponytail: idle pause saves battery, the smoke has faded by then
}
function move(x,y){wake();if(last){const dx=(x-last.x)/innerWidth*FORCE,dy=-(y-last.y)/innerHeight*FORCE;if(Math.abs(dx)+Math.abs(dy)>8)splat(x,y,dx,dy)}last={x,y}}

 if(!fluid||!el)return;wake();
 const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;

function initSignature(){const c=$('sig'),ctx=c.getContext('2d'),wrap=$('sigWrap'),dpr=window.devicePixelRatio||1;function resize(){const rc=c.getBoundingClientRect();c.width=Math.max(1,Math.round(rc.width*dpr));c.height=Math.max(1,Math.round(rc.height*dpr));ctx.scale(dpr,dpr);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#744360';ctx.lineWidth=2.8;}resize();let drawing=false;const point=e=>{let rc=c.getBoundingClientRect();return [e.clientX-rc.left,e.clientY-rc.top]};c.addEventListener('pointerdown',e=>{drawing=true;c.setPointerCapture(e.pointerId);let [x,y]=point(e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.1,y+.1);ctx.stroke();state.signed=true;wrap.classList.add('drawn')});c.addEventListener('pointermove',e=>{if(!drawing)return;let [x,y]=point(e);ctx.lineTo(x,y);ctx.stroke()});['pointerup','pointercancel','lostpointercapture'].forEach(x=>c.addEventListener(x,()=>drawing=false))}

const sceneTimings={
 theatrical:{opening:650,bureau:[1900,2200,2300,2400,2600,3000],matching:[2200,2500,2600,3000],approval:3200},

async function runAdoption(){
 let token=++state.job;
 // Snapshot pacing at the moment the form is submitted; no browser/network calls.
 const pace=sceneTimings[state.pace]||sceneTimings.theatrical;
 const reading=state.pace!=='quick';
 step('bureau');token=state.job;
 const feed=$('feed');const lines=t('bureauLines');
 await sleep(pace.opening);
 for(let i=0;i<lines.length;i++){
   if(state.job!==token)return;
   if(i===0){const placeholder=feed.querySelector('.feed-empty');if(placeholder)placeholder.remove()}
   const div=document.createElement('div');div.className='feed-line';div.innerHTML=`<span class="tick">✦</span>${esc(lines[i])}`;
   feed.appendChild(div);feed.scrollTop=feed.scrollHeight;
   const counter=$('bureauProgressText'),bar=$('bureauProgressFill');
   if(counter)counter.textContent=`FORM 69 · ${i+1}/${lines.length}`;
   if(bar)bar.style.width=`${Math.round(100*(i+1)/lines.length)}%`;
   if(!reading||i<lines.length-1)await sleep(reading?readMs(lines[i]):pace.bureau[Math.min(i,pace.bureau.length-1)]);
 }
 if(reading&&state.job===token)await waitNext('next');
 if(state.job!==token)return;
 step('matching');token=state.job;
 const match=t('matchLines');
 for(let i=0;i<match.length;i++){
   if(state.job!==token)return;
   const phrase=$('matchPhrase');if(phrase){phrase.style.opacity='0.5';phrase.textContent=match[i];requestAnimationFrame(()=>{if(state.job===token)phrase.style.opacity='1'})}
   const counter=$('matchProgress');if(counter)counter.textContent=String(i+1).padStart(2,'0')+' / '+String(match.length).padStart(2,'0');
   if(!reading||i<match.length-1)await sleep(reading?readMs(match[i]):pace.matching[Math.min(i,pace.matching.length-1)]);
 }
 if(reading&&state.job===token)await waitNext('next');
 if(state.job!==token)return;
 step('approve');token=state.job;
 if(reading)await waitNext('open');else await sleep(pace.approval);
 if(state.job!==token)return;
 state.completed.add(state.id);state.readOnly=false;step('reveal');
}

 if(v.status==='approved'){state.authorized=true;state.deadline=v.approvedUntil*1000;step('form');announce(t('authorized'))}
 else if(v.status==='adopted'){await syncRecords();step('reveal')}
 else if(v.status==='expired'||v.status==='rejected'){state.requestId=null;state.requestToken=null;state.authorized=false;step('sealed')}
 }catch(e){announce(e.message)}
}
function watchApproval(){const job=++state.pollJob;const poll=async()=>{if(job!==state.pollJob||state.authorized||!state.requestId)return;await checkApproval();if(job===state.pollJob&&!state.authorized&&state.requestId)setTimeout(poll,2500)};setTimeout(poll,1200)}
async function finalizeCloud(){
 const name=($('nick')?.value||state.nick||'').trim();
 if(!name){formError(t('errNick'));return}
 if(!state.signed){formError(t('errSign'));return}
 if(!$('consent')?.checked){formError(t('errLegal'));return}
 state.nick=name;
 try{
  const result=await requestApi('adopt','POST',{requestId:state.requestId,token:state.requestToken,nickname:name,consent:true,signatureConfirmed:true});
  state.records[state.id]=result.adoption;state.completed.add(state.id);state.pollJob++;await runAdoption();
 }catch(e){formError((state.lang==='ro'?'Nu s-a înregistrat adopția: ':'Adoption failed: ')+e.message)}
}
function agentPanel(){
 const ro=state.lang==='ro',known=!!state.agentToken;
 if(STATIC_ARCHIVE)return wrap(`${topPaper('STAFF RETIRED · 0068')}<div class="panel-center"><h1 class="subheadline">${ro?'MINISTERUL ESTE ÎNCHIS':'MINISTRY CLOSED'}</h1><p class="lead">${ro?'Adopțiile au fost arhivate definitiv.':'All completed adoptions are permanently archived.'}</p><div class="actions">${button('← '+esc(t('home')),'home','secondary')}</div></div>${paperBottom()}`,'slim');
 return `${wrap(`${topPaper('STAFF ONLY · AGENT 0068')}<div class="panel-center"><div class="eyebrow">DEPARTMENT OF AFTERLIFE AFFAIRS</div><h1 class="subheadline">${ro?'PANOU AGENT 0068':'AGENT 0068 DASHBOARD'}</h1><p class="lead">${ro?'Cereri noi actualizate automat la fiecare 5 secunde.':'New requests auto-refresh every 5 seconds.'}</p></div>${known?`<div class="statusbox"><b>✓ ${ro?'SESIUNE ACTIVĂ':'SIGNED IN'}</b><br><small>${state.agentExpiresAt?esc(new Date(state.agentExpiresAt).toLocaleString()):'Agent session active'}</small></div>`:`<div class="field"><label for="adminSecret">${ro?'TOKEN SECRET AGENT':'SECRET AGENT TOKEN'}</label><input type="password" id="adminSecret" autocomplete="off" placeholder="Agent access token"></div>`}<div class="actions">${button(known?(ro?'↻ REÎNCARCĂ':'↻ REFRESH'):(ro?'CONECTEAZĂ':'SIGN IN'),'adminLoad')}${known?button(ro?'DECONECTARE':'LOG OUT','agentLogout','secondary'):''}${button('← '+esc(t('home')),'home','secondary')}</div><div id="adminQueue" class="admin-list">${known?'<p>Loading applications...</p>':''}</div><p class="fine">${ro?'Parola principală nu se salvează în browser. După autentificare, dispozitivul reține o sesiune de 12 ore. Deconectarea șterge sesiunea de pe acest dispozitiv.':'The master token is not saved in the browser. A 12-hour Agent session is stored on this device. Logging out clears local access.'}</p>${paperBottom()}`,'slim')}`;
}
let adminBusy=false;
async function adminLoad(){
 if(!LIVE){announce('Cloudflare Worker required');return}
 if(adminBusy)return;
 adminBusy=true;
 try{
  const master=($('adminSecret')?.value||'').trim();
  let token=state.agentToken;
  if(master){
   try{
    const login=await requestApi('admin/session','POST',null,master);
    token=login.sessionToken;state.agentExpiresAt=login.expiresAt;saveAgentSession(login);
   }catch(e){
    // Compatible with the original Worker until the new one is deployed.
    if(!/API route not found/i.test(e.message))throw e;
    token=master;state.agentExpiresAt=0;clearSavedSession();
   }
   state.agentToken=token;render();
  }
  if(!token){announce(state.lang==='ro'?'Introdu tokenul Agentului':'Enter Agent token');return}
  const data=await requestApi('admin/queue','GET',null,token);
  const el=$('adminQueue');if(!el)return;
  state.remoteMode=data.mode;state.closed=!!data.closed;
  const reqs=data.requests||[],pending=reqs.filter(r=>r.status==='pending');
  const recent=reqs.filter(r=>r.status!=='pending').slice(0,5);
  const formatRequest=r=>`<div class="admin-request"><b>👻 GHOST ${esc(r.ghostId)}</b><small>${esc(r.status)} · ${esc(new Date(r.createdAt*1000).toLocaleString())}</small><div class="actions">${r.status==='pending'&&!state.closed?button('✓ APPROVE','approve:'+r.id,'primary')+button('× REJECT','reject:'+r.id,'secondary'):''}</div></div>`;
  el.innerHTML=`<div class="statusbox"><b>${esc(String(data.adoptedCount||0))}/30 ${state.lang==='ro'?'adoptate':'adopted'}</b><br>${state.closed?'🔒 '+(state.lang==='ro'?'ADOPȚII ÎNCHISE':'ADOPTIONS CLOSED'):pending.length+' '+(state.lang==='ro'?'cereri în așteptare':'pending applications')}</div>`+
   (pending.length?pending.map(formatRequest).join(''):'<p>✓ '+(state.lang==='ro'?'Nicio cerere nouă.':'No new requests.')+'</p>')+
   (recent.length?'<p class="fine">'+(state.lang==='ro'?'ULTIMELE CERERI':'RECENT APPLICATIONS')+'</p>'+recent.map(formatRequest).join(''):'')+
   `<div class="actions" style="margin-top:24px">${button('↻ REFRESH','adminLoad','secondary')}${data.mode==='test'?button(state.lang==='ro'?'ȘTERGE TOATE ADOPȚIILE DE TEST':'RESET TEST ADOPTIONS','adminReset','secondary'):data.mode==='live'&&!state.closed?button(state.lang==='ro'?'🔒 ÎNCHIDE ADOPȚIILE DEFINITIV':'🔒 CLOSE ADOPTIONS','adminClose','secondary'):''}</div>`;
 }catch(e){
  if(/Agent authentication required/i.test(e.message)){state.agentToken=null;state.agentExpiresAt=0;clearSavedSession();render()}
  announce(e.message);
 }finally{adminBusy=false}
}
async function adminCommand(cmd,id){
 try{await requestApi('admin/'+cmd,'POST',id?{requestId:id}:{confirm:cmd==='close'?'CLOSE_LIVE_ADOPTIONS':'RESET_ALL_TEST_ADOPTIONS'},state.agentToken);await syncRecords();await adminLoad();announce('OK')}
 catch(e){announce(e.message)}
}
async function action(cmd){
 if(cmd.startsWith('approve:'))return adminCommand('approve',cmd.slice(8));
 if(cmd.startsWith('reject:'))return adminCommand('reject',cmd.slice(7));
 if(cmd==='adminLoad')return adminLoad();if(cmd==='agentLogout'){state.agentToken=null;state.agentExpiresAt=0;clearSavedSession();render();return}if(cmd==='adminClose'){if(confirm(state.lang==='ro'?'ATENȚIE: Închizi definitiv toate adopțiile LIVE? După aceea poți arhiva dosarele.':'Close LIVE adoptions permanently?'))return adminCommand('close');return}if(cmd==='adminSync')return adminCommand('sync');if(cmd==='adminReset'){if(confirm(state.lang==='ro'?'Ștergi toate adopțiile de TEST de pe server?':'Delete all TEST adoptions on server?'))return adminCommand('reset');return}
 if(cmd==='home'){state.readOnly=false;step('home')}
 else if(cmd==='select'){resetCurrent();step('select')}
 else if(cmd==='resetDemo'){if(confirm(state.lang==='ro'?'Ștergi toate adopțiile locale de test?':'Delete all local test adoptions?')){state.records={};state.completed.clear();writeLocal({});step('home')}}
 else if(cmd==='demoScan'){const typed=$('testId')?.value.trim()||'001';const id=typed.padStart(3,'0');if(!validId(id)){announce('ID 001–030');return}state.id=id;resetCurrent();if(LIVE){await syncRecords()}step(state.completed.has(id)?'reveal':'sealed')}
 else if(cmd==='sealed'){step('sealed')}
 else if(cmd==='requestApproval'){await requestApproval()}
 else if(cmd==='checkApproval'){await checkApproval()}
 else if(cmd==='auth'){state.authorized=true;state.deadline=Date.now()+120000;step('form');announce(t('authorized'))}
 else if(cmd==='form'){if(countdownExpired()){state.authorized=false;step('sealed');announce(t('expired'))}else step('form')}
 else if(cmd==='clear'){state.signed=false;render()}
 else if(cmd==='quick'){
  if(!DEMO){formError('Demo is disabled');return}
  if(countdownExpired()){formError(t('errExpired'));return}
  state.nick=$('nick')?.value.trim()||'Drama Queen';state.signed=true;state.consent=true;
  if(!saveLocalRecord(state.id,state.nick)){formError('Browser storage blocked');return}await runAdoption();
 }
 else if(cmd==='submit'){
  if(countdownExpired()){formError(t('errExpired'));return}
  const name=$('nick')?.value.trim()||'';
  if(!name){formError(t('errNick'));$('nick')?.focus();return}
  if(!state.signed){formError(t('errSign'));return}
  if(!$('consent')?.checked){formError(t('errLegal'));return}
  state.nick=name;state.consent=true;
 if(window.GhostFX&&!(await GhostFX.bleed()))return;
  if(LIVE){await finalizeCloud();return}
  if(STATIC_ARCHIVE){formError('Adoption center is closed');return}
  if(!saveLocalRecord(state.id,name)){formError('Browser storage blocked');return}
  await runAdoption();
 }
 else if(cmd==='archive'){step('archive')}else if(cmd==='print'){print()}
 else if(cmd==='toggleClose'){state.closedPreview=!state.closedPreview;step('home')}
}
$('main').addEventListener('click',e=>{const target=e.target.closest('[data-action],[data-select],[data-archive]');if(!target)return;if(target.hasAttribute('data-select')){if(LIVE||STATIC_ARCHIVE)return;state.id=target.getAttribute('data-select');state.authorized=false;state.nick='';state.consent=false;state.signed=false;state.readOnly=false;step(state.completed.has(state.id)?'reveal':'sealed')}else if(target.hasAttribute('data-archive')){state.id=target.getAttribute('data-archive');if((DEMO&&state.inspector)||state.completed.has(state.id)){state.readOnly=!state.completed.has(state.id);step('reveal')}else {state.readOnly=false;state.authorized=false;step('sealed')}}else action(target.getAttribute('data-action'))});
$('main').addEventListener('input',e=>{if(e.target.id==='nick')state.nick=e.target.value});$('main').addEventListener('change',e=>{if(e.target.id==='consent')state.consent=e.target.checked;if(e.target.id==='paceSelect')state.pace=e.target.value;if(e.target.id==='inspector'){state.inspector=e.target.checked;render()}});
function updateLanguage(l){if(state.lang===l)return;state.lang=l;render()}
$('btnRo').addEventListener('click',()=>updateLanguage('ro'));$('btnEn').addEventListener('click',()=>updateLanguage('en'));$('homeLogo').addEventListener('click',()=>step('home'));
window.addEventListener('popstate',()=>{let p=new URLSearchParams(location.search);let id=p.get('g');state.id=validId(id)?id:null;state.authorized=false;state.readOnly=false;step(p.get('agent')==='0068'?'agent':state.id?(state.completed.has(state.id)?'reveal':'sealed'):p.has('archive')?'archive':'home')});
if(q.get('agent')==='0068'){state.step='agent'}else if(validId(q.get('g'))){state.id=q.get('g');state.step=state.completed.has(state.id)?'reveal':'sealed'}else if(q.has('archive'))state.step='archive';render();
if(STATIC_ARCHIVE){loadStaticArchive()}
else if(LIVE){syncRecords().then(()=>{if(state.id&&state.completed.has(state.id)&&state.step==='sealed')step('reveal')});if(state.step==='agent'&&state.agentToken)adminLoad()}
setInterval(()=>{if(state.step==='agent'&&LIVE&&state.agentToken&&(!state.agentExpiresAt||state.agentExpiresAt>Date.now()))adminLoad()},5000);
})();
</script></body>
</html>
